<!doctype html><meta charset="utf-8">
<!-- One frame of the homepage's ocean, for a card: no text. Drawn by the same
     modules as the site (src/app/components/ocean), compiled by generate.py. -->
<style>*{margin:0}body{width:1200px;height:630px;overflow:hidden}canvas{display:block;width:1200px;height:630px}</style>
<canvas id="c"></canvas>
<script type="module">
import * as A from "./ocean/art.js";
import { createSchool } from "./ocean/school.js";
import { createSignet } from "./ocean/signet.js";
import * as W from "./ocean/whale.js";
import { whaleTurn } from "./ocean/whaleTurn.js";

const q = new URLSearchParams(location.search);
const light = q.get("night") !== "1", rtl = q.get("rtl") === "1", mode = q.get("mode"), seed = +q.get("seed"), center = q.get("center") === "1";
const w = 1200, h = 630, D = 2, P = light ? A.PALETTES.light : A.PALETTES.dark;
const cv = document.getElementById("c");
cv.width = w * D;
cv.height = h * D;
const g = cv.getContext("2d");
const school = createSchool(w, h), whales = W.createWhales(w, h, 0), signet = createSignet(w, h, false, 0.5, 0);
for (let i = 0, t = 0; i < 30 * (4 + seed * 2.7); i++) school.step(1 / 30, (t += 1 / 30), []);
const shoal = A.fishSheet(P, light, false), gold = A.fishSheet(P, light, true), halo = A.haloSprite(P, light);

g.setTransform(D, 0, 0, D, 0, 0);
g.drawImage(A.waterBackdrop(P, light, w, h, D), 0, 0, w, h);
const r = A.seeded(42 + seed);
g.fillStyle = A.rgba(P.dust, 0.16);
for (let i = 0; i < 110; i++) {
  g.beginPath();
  g.ellipse(r() * w, r() * h, 0.5 + r() * 1.4, 0.5 + r(), 0, 0, 7);
  g.fill();
}
function fish(sheet, x, y, dir, roll, size, alpha, beat) {
  const f = Math.cos(dir) < 0 ? -1 : 1, a = f < 0 ? dir + Math.PI : dir, C = Math.cos(a) * D, S = Math.sin(a) * D;
  const sx = f * (1 - 0.09 * roll), sy = 1 - 0.32 * roll;
  g.setTransform(C * sx, S * sx, -S * sy, C * sy, x * D, y * D);
  g.globalAlpha = alpha;
  const cell = ((Math.floor((beat / A.TAU) * A.FISH_FRAMES) % A.FISH_FRAMES) + A.FISH_FRAMES) % A.FISH_FRAMES;
  g.drawImage(sheet, cell * A.FISH_W, 0, A.FISH_W, A.FISH_H, -size, (-size * 2) / 3, size * 2, (size * 4) / 3);
}
// Three-quarter poses, as [head, middle, tail] headings; mirrored for RTL.
const POSES = [[1.02, 0.62, 0.3], [2.3, 1.95, 1.5], [0.55, 0.35, 0.2], [2.75, 2.5, 2.2]];
function whale(x, y, size, yaw, opacity) {
  const s = whales.lead;
  s.size = size;
  W.setCourse(s, false);
  const dir = rtl ? yaw.map((a) => Math.PI - a) : yaw;
  s.yaw.set(dir);
  s.pYaw.set(dir);
  Object.assign(s, { x: rtl ? w - x : x, px: rtl ? w - x : x, y, py: y, presence: 1, opacity, beat: 1 + seed, effort: 0.5, yawRate: 0.6 });
  const px = Math.min(size * D, 760), art = A.whaleSprite(P, light, px);
  W.drawWhale(g, s, 1, art, W.whaleBuffer(art, px), px, D, w, 0, 1, whaleTurn(P, light, px));
  g.globalAlpha = 1;
}
if (mode === "whale") whale(930, 330, 240, POSES[seed % POSES.length], light ? 0.92 : 0.95);
if (mode === "both") whale(1000, 430, 215, [3.14, 3.14, 3.14], 0.5);
if (mode !== "whale") signet.finish(school);
for (let i = school.n - 1; i >= 0; i--) {
  if (school.alive[i])
    fish(shoal, school.x[i], school.y[i], school.heading[i], school.roll[i], school.size[i] * 1.25, 0.13 + school.depth[i] * 0.55, school.phase[i]);
}
if (mode !== "whale") {
  const dx = center ? 0 : rtl ? -300 : 300;
  signet.paint(P, light, D);
  g.setTransform(D, 0, 0, D, dx * D, 0);
  signet.drawLines(g, 0, true);
  for (let i = 0; i < signet.count; i++) {
    const x = signet.x[i] + dx, y = signet.y[i], s = signet.size[i];
    g.setTransform(D, 0, 0, D, x * D, y * D);
    g.globalAlpha = 1;
    g.drawImage(halo, -s * 1.2, -s * 1.2, s * 2.4, s * 2.4);
    fish(gold, x, y, signet.heading[i], 0.1, s * 1.1, 1, i);
  }
}
document.title = "done";
</script>
