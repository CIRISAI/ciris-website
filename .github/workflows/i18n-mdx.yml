name: i18n mdx

# Translate MDX docs into the site's locales, glossary-first and fail-closed.
#
# Ported from CIRISClient's i18n lane. Two jobs, and the split matters:
#
#   guard      — runs on EVERY push and pull request. Calls no model, needs no
#                secret, costs nothing. It asserts the segmenter still
#                round-trips all 757 documents byte-for-byte, which is the only
#                thing standing between a translation run and a corrupted doc
#                tree in 29 languages nobody on the team reads.
#
#   translate  — manual (workflow_dispatch) only. Spends money. Opens a PR
#                rather than pushing, because a machine translation of the
#                Constitution should be looked at by a person before it is live.
#
# The guard is deliberately not gated behind the translate job: it is most
# useful on the PRs that CHANGE the segmenter, where a regression would
# otherwise only show up the next time someone spent a budget.

on:
  push:
    paths:
      - 'scripts/i18n/**'
      - 'content/**/*.mdx'
      - '.github/workflows/i18n-mdx.yml'
  pull_request:
    paths:
      - 'scripts/i18n/**'
      - 'content/**/*.mdx'
      - '.github/workflows/i18n-mdx.yml'
  workflow_dispatch:
    inputs:
      langs:
        description: 'Locale codes, comma-separated (blank = all 28)'
        required: false
        default: 'es'
      limit:
        description: 'Max documents to translate this run (budget guard; 0 = no cap)'
        required: false
        default: '5'
      overwrite:
        description: 'Retranslate documents that already have a translation'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: i18n-mdx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: guard (free — no model, no secret)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # THE ONE THAT MATTERS.
      #
      # Segment every .mdx and put it back together without translating
      # anything; the result must equal the input byte for byte. A segmenter
      # that mangles a code fence or drops a table's alignment row produces a
      # page that renders wrong in a language no reviewer here reads, and looks
      # finished while doing it. An earlier version of the segmenter merged
      # adjacent table rows in 203 of 757 files; this test is what caught it.
      - name: Segmenter round-trips the whole corpus
        run: python3 scripts/i18n/test_mdx_segment.py

      - name: Coverage report
        run: python3 scripts/i18n/translate_mdx.py --check

  translate:
    name: translate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Translate
        env:
          # Repo secret, already provisioned on this repository.
          # Prefer moving it to an org-level secret scoped to the repos that
          # need it: CIRISClient and CIRISAgent each keep their own copy today,
          # so rotating this key currently means three places, and SONAR_TOKEN
          # already proves the org path reaches this repo.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${OPENROUTER_API_KEY:-}" || {
            echo "::error::OPENROUTER_API_KEY is empty. Set it as a repository or organization secret."
            exit 1
          }
          args=""
          if [ -n "${{ inputs.langs }}" ]; then
            for l in $(echo "${{ inputs.langs }}" | tr ',' ' '); do args="$args --lang $l"; done
          fi
          [ "${{ inputs.limit }}" != "0" ] && args="$args --limit ${{ inputs.limit }}"
          [ "${{ inputs.overwrite }}" = "true" ] && args="$args --overwrite"
          echo "running: translate_mdx.py $args"
          python3 scripts/i18n/translate_mdx.py $args

      # Re-assert the guarantee on the OUTPUT, not just the input. The
      # translated files are now part of the corpus, so if a translation broke
      # a table this fails here rather than on someone's next PR.
      - name: The output must still round-trip
        run: python3 scripts/i18n/test_mdx_segment.py

      - name: Open a PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: i18n/mdx-${{ github.run_id }}
          title: 'i18n: translated MDX (${{ inputs.langs || "all" }})'
          commit-message: 'i18n: translated MDX for ${{ inputs.langs || "all locales" }}'
          body: |
            Machine translation from `.github/workflows/i18n-mdx.yml`.

            Glossary-first and fail closed: any segment whose translation lost a
            placeholder — a URL, a code span, a link target — was rejected and
            left in English rather than written. A half-translated page a reader
            can navigate beats a complete one with a dead link in it.

            The segmenter round-trip was asserted on the output as well as the
            input, so no table, code fence or frontmatter key moved.

            **Still worth a human read.** Terminology is enforced by the
            glossaries; meaning is not. See the run log for anything rejected.
          labels: i18n, automated
          delete-branch: true
